[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrapeflow"
version = "0.3.0"
description = "Self-hosted watcher that crawls websites and copies new and changed files into local, S3 or WebDAV storage."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["crawler", "file-sync", "web-archive", "markdown", "rag", "data-pipeline", "s3", "webdav", "nextcloud", "ai"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "sqlmodel>=0.0.22",
  "pydantic-settings>=2.4",
  "apscheduler>=3.10,<4",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "anthropic>=1.0",
  "markitdown[pdf,docx,xlsx,pptx]>=0.1.2",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6", "boto3>=1.34", "moto[s3]>=5"]

[project.scripts]
scrapeflow = "scrapeflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["scrapeflow"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 115
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
